version: "3.9"

services:
  api:
    build: ..
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8008:8000"
    env_file: ../.env.local
    volumes:
      - ..:/app
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: